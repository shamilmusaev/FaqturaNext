<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  .scale{display:flex;align-items:flex-end;gap:10px}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{background:var(--brand);width:24px}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
</style></head>
<body style="padding:24px;background:var(--paper)">
  <div class="scale">
    <div class="col"><div class="bar" style="height:4px"></div><div class="lbl">4</div></div>
    <div class="col"><div class="bar" style="height:8px"></div><div class="lbl">8</div></div>
    <div class="col"><div class="bar" style="height:12px"></div><div class="lbl">12</div></div>
    <div class="col"><div class="bar" style="height:16px"></div><div class="lbl">16</div></div>
    <div class="col"><div class="bar" style="height:20px"></div><div class="lbl">20</div></div>
    <div class="col"><div class="bar" style="height:24px"></div><div class="lbl">24</div></div>
    <div class="col"><div class="bar" style="height:32px"></div><div class="lbl">32</div></div>
    <div class="col"><div class="bar" style="height:40px"></div><div class="lbl">40</div></div>
    <div class="col"><div class="bar" style="height:56px"></div><div class="lbl">56</div></div>
    <div class="col"><div class="bar" style="height:80px"></div><div class="lbl">80</div></div>
  </div>
  <div class="small" style="color:var(--ink-3);margin-top:14px">Spacing scale --- 4px base. Card padding usually 24/28.</div>
</body></html>
