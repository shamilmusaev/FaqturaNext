<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  .row{display:flex;gap:14px;align-items:flex-end}

  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-top:8px;text-align:center}
</style></head>
<body style="padding:24px;background:var(--paper)">
  <div class="row">
    <div><div class="b" style="border-radius:0"></div><div class="lbl">0</div></div>
    <div><div class="b" style="border-radius:8px"></div><div class="lbl">8</div></div>
    <div><div class="b" style="border-radius:12px"></div><div class="lbl">12 · input</div></div>
    <div><div class="b" style="border-radius:16px"></div><div class="lbl">16 · card-s</div></div>
    <div><div class="b" style="border-radius:24px"></div><div class="lbl">24 · card</div></div>
    <div><div class="b" style="border-radius:999px"></div><div class="lbl">pill</div></div>
  </div>
</body></html>
