<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  .btn{font-family:var(--font-sans);font-size:14px;font-weight:500;border-radius:999px;padding:11px 20px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;letter-spacing:-0.005em}
  .primary{background:var(--ink);color:#F4F1E8}
  .primary:hover{background:#2A2620}
  .secondary{background:var(--card);color:var(--ink);border:1px solid var(--line-2)}
  .secondary:hover{background:var(--paper-2)}
  .brand{background:var(--brand);color:var(--brand-ink)}
  .brand:hover{background:var(--brand-2)}
  .accent{background:var(--accent);color:var(--accent-ink)}
  .accent:hover{background:var(--accent-2)}
  .ghost{background:transparent;color:var(--ink);padding:11px 14px}
  .ghost:hover{background:var(--paper-2)}
  .icon{width:16px;height:16px;display:inline-block}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-bottom:6px}
</style></head>
<body style="padding:24px;background:var(--paper)">
  <div class="lbl">Pill buttons --- 999px radius, 11/20 padding, weight 500</div>
  <div class="row">
    <button class="btn primary">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      Send invoice
    </button>
    <button class="btn brand">Mark as paid</button>
    <button class="btn accent">New invoice</button>
    <button class="btn secondary">Save draft</button>
    <button class="btn ghost">Cancel</button>
  </div>
</body></html>
