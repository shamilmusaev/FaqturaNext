<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  .nav{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;gap:2px}
  .item{font-size:14px;font-weight:500;color:var(--ink-2);padding:8px 18px;border-radius:999px;cursor:pointer}
  .item.active{background:var(--ink);color:#F4F1E8}
  .item:hover:not(.active){background:var(--paper-2);color:var(--ink)}
  .sub{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-top:14px}
  .icons{display:flex;gap:6px;margin-top:18px;align-items:center}
  .icon-btn{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-2);cursor:pointer}
  .icon-btn:hover{background:var(--paper-2);color:var(--ink)}
  svg{width:18px;height:18px}
</style></head>
<body style="padding:24px;background:var(--paper)">
  <div class="nav">
    <div class="item active">Overview</div>
    <div class="item">Invoices</div>
    <div class="item">Clients</div>
    <div class="item">Expenses</div>
    <div class="item">Reports</div>
  </div>
  <div class="sub">Pill nav --- active uses --ink background</div>
  <div class="icons">
    <div class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>
    <div class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>
    <div class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></div>
    <div class="icon-btn" style="background:var(--ink);color:var(--accent);border-color:var(--ink);width:auto;padding:0 16px;gap:8px;border-radius:999px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg><span style="font-size:13px;font-weight:500">New invoice</span></div>
  </div>
</body></html>
