<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  .row{display:flex;gap:16px}
  .stat{flex:1;border-radius:20px;padding:20px;background:var(--card);border:1px solid var(--line)}
  .stat.accent-fill{background:var(--accent);border-color:transparent}
  .stat.brand-fill{background:var(--brand);border-color:transparent;color:var(--brand-ink)}
  .lbl{font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:14px}
  .brand-fill .lbl{color:#C4D0CA}
  .num{font-family:var(--font-display);font-size:36px;letter-spacing:-0.025em;line-height:1}
  .delta{font-size:12px;margin-top:10px}
</style></head>
<body style="padding:24px;background:var(--paper)">
  <div class="row">
    <div class="stat">
      <div class="lbl">Outstanding</div>
      <div class="num mono" style="font-family:var(--font-display)">€ 4,820</div>
      <div class="delta" style="color:var(--neg)">↑ 12% from last week</div>
    </div>
    <div class="stat accent-fill">
      <div class="lbl" style="color:var(--ink-2)">Paid this month</div>
      <div class="num">€ 18,340</div>
      <div class="delta" style="color:var(--ink-2)">↑ 24%  from last month</div>
    </div>
    <div class="stat brand-fill">
      <div class="lbl">Avg days to pay</div>
      <div class="num">12.4</div>
      <div class="delta" style="color:#C4D0CA">↓ 2.1 days</div>
    </div>
  </div>
</body></html>
