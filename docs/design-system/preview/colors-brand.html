<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:14px;height:120px;display:flex;flex-direction:column;justify-content:space-between;padding:16px;border:1px solid var(--line)}
  .h{font-family:var(--font-mono);font-size:12px;letter-spacing:0.04em;opacity:0.7}
  .n{font-size:14px;font-weight:500}
  .role{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.6}
</style></head>
<body style="padding:24px;background:var(--paper)">
  <div class="row">
    <div class="sw" style="background:var(--brand);color:var(--brand-ink);border-color:var(--brand)">
      <div class="role">Brand</div>
      <div><div class="n">Faqtura orange</div><div class="h">#EC5A2A</div></div>
    </div>
    <div class="sw" style="background:var(--ink);color:#FFFFFF;border-color:var(--ink)">
      <div class="role">Action</div>
      <div><div class="n">Ink --- primary button + nav</div><div class="h">#14110D</div></div>
    </div>
    <div class="sw" style="background:var(--card);color:var(--ink)">
      <div class="role">Surface</div>
      <div><div class="n">Card white</div><div class="h">#FFFFFF</div></div>
    </div>
  </div>
</body></html>
