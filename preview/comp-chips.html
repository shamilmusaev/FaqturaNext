<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:500}
  .dot{width:7px;height:7px;border-radius:50%}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
</style></head>
<body style="padding:24px;background:var(--paper)">
  <div class="row">
    <span class="chip" style="background:var(--pos-bg);color:var(--pos)"><span class="dot" style="background:var(--pos)"></span>Paid</span>
    <span class="chip" style="background:var(--warn-bg);color:var(--warn)"><span class="dot" style="background:var(--warn)"></span>Pending</span>
    <span class="chip" style="background:var(--neg-bg);color:var(--neg)"><span class="dot" style="background:var(--neg)"></span>Overdue · 12 d</span>
    <span class="chip" style="background:var(--info-bg);color:var(--info)"><span class="dot" style="background:var(--info)"></span>Sent</span>
    <span class="chip" style="background:var(--paper-2);color:var(--ink-2)"><span class="dot" style="background:var(--ink-3)"></span>Draft</span>
  </div>
  <div class="row" style="margin-top:8px">
    <span class="chip" style="background:var(--accent);color:var(--accent-ink)">ROT 30%</span>
    <span class="chip" style="background:var(--ink);color:#F4F1E8">RUT 50%</span>
    <span class="chip" style="background:var(--card);border:1px solid var(--line-2);color:var(--ink-2)">EUR</span>
    <span class="chip" style="background:var(--card);border:1px solid var(--line-2);color:var(--ink-2)">SEK</span>
    <span class="chip" style="background:var(--card);border:1px solid var(--line-2);color:var(--ink-2)">VAT 25%</span>
  </div>
</body></html>
