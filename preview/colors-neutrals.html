<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:14px;height:100px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;border:1px solid var(--line)}
  .h{font-family:var(--font-mono);font-size:12px;letter-spacing:0.04em}
  .n{font-size:13px;font-weight:500;margin-bottom:2px}
</style></head>
<body style="padding:24px;background:var(--paper)">
  <div class="row">
    <div class="sw" style="background:var(--ink);color:#FFFFFF;border-color:var(--ink)">
      <div class="n">Ink</div><div class="h">#14110D</div>
    </div>
    <div class="sw" style="background:var(--paper-2);color:var(--ink)">
      <div class="n">Paper 2</div><div class="h">#E5E2DA</div>
    </div>
    <div class="sw" style="background:var(--paper);color:var(--ink)">
      <div class="n">Paper</div><div class="h">#EFEDE7</div>
    </div>
    <div class="sw" style="background:var(--card);color:var(--ink)">
      <div class="n">Card</div><div class="h">#FFFFFF</div>
    </div>
  </div>
</body></html>
