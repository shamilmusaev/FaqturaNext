<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  label{font-size:12px;font-weight:500;color:var(--ink-2)}
  .input{background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:11px 14px;font-family:var(--font-sans);font-size:14px;color:var(--ink);width:100%;outline:none}
  .input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,17,13,0.08)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .with-icon{position:relative}
  .with-icon .input{padding-left:36px}
  .with-icon svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);width:16px;height:16px}
</style></head>
<body style="padding:24px;background:var(--paper)">
  <div class="grid">
    <div class="field">
      <label>Client</label>
      <div class="with-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input class="input" value="Nordkraft AB" />
      </div>
    </div>
    <div class="field">
      <label>Invoice number</label>
      <input class="input" style="font-family:var(--font-mono)" value="INV-2026-0312" />
    </div>
    <div class="field">
      <label>Amount</label>
      <input class="input" style="font-family:var(--font-mono)" value="€ 4,820.00" />
    </div>
    <div class="field">
      <label>Due date</label>
      <input class="input" value="May 28, 2026" />
    </div>
  </div>
</body></html>
