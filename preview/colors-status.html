<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .cell{border-radius:14px;padding:18px;border:1px solid var(--line);background:var(--card)}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
  .chip{display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:500}
  .h{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-top:10px}
</style></head>
<body style="padding:24px;background:var(--paper)">
  <div class="grid">
    <div class="cell">
      <span class="chip" style="background:var(--pos-bg);color:var(--pos)"><span class="dot" style="background:var(--pos)"></span>Paid</span>
      <div class="h">--pos · #1F7A4D</div>
    </div>
    <div class="cell">
      <span class="chip" style="background:var(--warn-bg);color:var(--warn)"><span class="dot" style="background:var(--warn)"></span>Pending</span>
      <div class="h">--warn · #C8881F</div>
    </div>
    <div class="cell">
      <span class="chip" style="background:var(--neg-bg);color:var(--neg)"><span class="dot" style="background:var(--neg)"></span>Overdue</span>
      <div class="h">--neg · #B43A2C</div>
    </div>
  </div>
</body></html>
