<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  .row{display:flex;gap:18px}
  .box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;height:120px;display:flex;flex-direction:column;justify-content:space-between}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
  .name{font-weight:500;font-size:13px}
</style></head>
<body style="padding:24px;background:var(--paper)">
  <div class="row">
    <div class="box" style="box-shadow:none">
      <div class="name">Flat</div>
      <div class="lbl">--shadow-flat</div>
    </div>
    <div class="box" style="box-shadow:var(--shadow-soft);border-color:transparent">
      <div class="name">Soft</div>
      <div class="lbl">--shadow-soft<br>cards, stat tiles</div>
    </div>
    <div class="box" style="box-shadow:var(--shadow-pop);border-color:transparent">
      <div class="name">Pop</div>
      <div class="lbl">--shadow-pop<br>menus, popovers</div>
    </div>
  </div>
</body></html>
